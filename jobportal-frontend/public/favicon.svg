<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <!-- Definitions for Font and Clip Path -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700&amp;display=swap');
      .logo-text {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
        font-size: 110px;
      }
    </style>
    
    <!-- Outer Rounded Container Clip Path -->
    <clipPath id="container-clip">
      <rect x="20" y="20" width="760" height="200" rx="28" ry="28" />
    </clipPath>
  </defs>

  <!-- Main Outer Rounded Container Group -->
  <g clip-path="url(#container-clip)">
    <!-- Left Section Background (Corporate Blue) -->
    <polygon points="20,20 410,20 340,220 20,220" fill="#1E3A8A" />
    
    <!-- Right Section Background (Deep Navy) -->
    <polygon points="410,20 780,20 780,220 340,220" fill="#0F172A" />

    <!-- Slanted White Divider Line -->
    <line x1="410" y1="20" x2="340" y2="220" stroke="#FFFFFF" stroke-width="12" />

    <!-- Text: 'Job' (Pure White) -->
    <text x="120" y="158" fill="#FFFFFF" class="logo-text">Job</text>

    <!-- Text: 'Sansar' (Energetic Coral / Orange) -->
    <text x="415" y="158" fill="#10b981" class="logo-text">Sansar</text>
  </g>
</svg>
